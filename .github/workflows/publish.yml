name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm run test
      - run: npm run build

      - name: Publish
        run: |
          VERSION=$(node -p "require('./packages/raindrops-on-roses/package.json').version")
          PRERELEASE=$(node -p "'$VERSION'.match(/-(.+?)(\.|$)/)?.[1] ?? ''")

          if [ -n "$PRERELEASE" ]; then
            TAG="$PRERELEASE"
          else
            TAG="latest"
          fi

          npm publish --workspace=@aleclloydprobert/clamp --tag "$TAG"
          npm publish --workspace=@aleclloydprobert/numbers-from-seed --tag "$TAG"
          npm publish --workspace=raindrops-on-roses --tag "$TAG"
